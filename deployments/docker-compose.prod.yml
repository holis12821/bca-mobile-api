# deployments/docker-compose.prod.yml — single-VM deployment.
#
#   docker compose -f deployments/docker-compose.prod.yml --env-file .env.prod run --rm migrate
#   docker compose -f deployments/docker-compose.prod.yml --env-file .env.prod up -d
#
# Only nginx publishes a port. Postgres and Redis stay on the internal network:
# a database reachable from the internet is the most common way a project like
# this gets owned, and binding it to the host is how that happens by accident.

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      - api
    networks: [edge, internal]

  api:
    image: bca-mobile-api:${APP_VERSION:-latest}
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSLMODE: disable          # internal network only; TLS terminates at nginx
      REDIS_SESSION_HOST: redis-session
      REDIS_SESSION_PORT: "6379"
      REDIS_CACHE_HOST: redis-cache
      REDIS_CACHE_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_PRIVATE_KEY_PATH: /keys/private.pem
      JWT_PUBLIC_KEY_PATH: /keys/public.pem
      PIN_RSA_PRIVATE_KEY_PATH: /keys/pin_private.pem
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      LOOKUP_HMAC_SECRET: ${LOOKUP_HMAC_SECRET}
      TZ: UTC
    volumes:
      - ../keys:/keys:ro
    depends_on:
      postgres:      { condition: service_healthy }
      redis-session: { condition: service_healthy }
      redis-cache:   { condition: service_healthy }
    networks: [internal]

  # Migrations run as their own step, never inside the API's startup.
  # An application that migrates on boot races with itself the moment there
  # are two replicas, and turns a bad migration into a crash loop.
  migrate:
    image: migrate/migrate:v4.17.1
    profiles: ["tools"]
    volumes:
      - ../migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable"
      - "up"
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis-session:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory-policy noeviction
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_session_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

networks:
  edge:
  internal:
    # No egress to the internet. Correct while every external provider is
    # stubbed in-process. The moment the API must reach a real e-wallet,
    # push-notification, or SMS provider, drop `internal: true` (or put `api`
    # on `edge` as well) — otherwise those calls fail with a DNS error that
    # looks nothing like a networking problem.
    internal: true

volumes:
  postgres_data:
  redis_session_data:
  certbot_webroot:
